services:
  mongodb:
    image: mongo:6.0
    container_name: disastermongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  model-service:
    build: ./model-service
    container_name: model-service
    ports:
      - "5001:5001"

  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - model-service

volumes:
  mongodata:
