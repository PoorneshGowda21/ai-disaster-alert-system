name: CI Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install backend
        run: |
          cd backend
          npm install

      - name: Run backend tests
        run: echo "Tests go here"

      - name: Install model service
        run: |
          cd model-service
          pip install -r requirements.txt
